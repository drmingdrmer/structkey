[workspace]
resolver = "2"
members = ["crates/structkey", "crates/structkey-derive"]

[workspace.package]
version = "0.1.0"
authors = ["Zhang Yanpo <drdr.xp@gmail.com>"]
license = "Apache-2.0"
edition = "2024"
repository = "https://github.com/drmingdrmer/structkey"
homepage = "https://github.com/drmingdrmer/structkey"

[workspace.dependencies]
# Internal crates
structkey = { version = "0.1.0", path = "crates/structkey" }

# External
anyhow = "1"
thiserror = "2"
trybuild = "1"
