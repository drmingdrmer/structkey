[package]
name = "structkey"
description = "Encode structured Rust types as /-separated, percent-escaped string keys, with #[derive(Codec)] for zero-boilerplate round-trips. Designed for use as KV-store key namespaces."
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = ["key", "codec", "kv-store", "derive"]
categories = ["encoding", "data-structures"]
readme = "../../README.md"

[features]
default = ["derive"]
derive = ["dep:structkey-derive"]

[dependencies]
structkey-derive = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
trybuild = { workspace = true }

[[test]]
name = "derive"
path = "tests/derive.rs"
required-features = ["derive"]

[[test]]
name = "derive_compile_fail"
path = "tests/derive_compile_fail.rs"
required-features = ["derive"]
