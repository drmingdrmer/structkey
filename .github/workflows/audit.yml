name: Security

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday
  push:
    paths:
      - '**/Cargo.toml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo generate-lockfile
      # Install a prebuilt binary: building cargo-audit from source would use the
      # nightly pinned in rust-toolchain.toml, which is older than its dependencies' MSRV.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
